<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Draco</title>
    <meta name="description" content="Draco - Art gallery featuring comic, original, comms, memes & stickers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* ===== THEME VARIABLES ===== */
      [data-theme="dark"] {
        --bg: #1c1c1e; 
        --bg-alt: #252528;
        --fg: #e8e8e8; 
        --fg-muted: #999999;
        --accent: #b81a2e; 
        --accent-light: #e03b4e; 
        --accent-glow: rgba(184, 26, 46, 0.25);
        --border: #3a3a3f; 
        --border-hover: #b81a2e;
        --card-bg: #2a2a2d; 
        --card-bg-hover: #333336;
        --muted: rgba(184, 26, 46, 0.10);
        --card-radius: 14px; 
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        --shadow-hover: 0 20px 50px rgba(184, 26, 46, 0.2);
        --glow: 0 0 25px rgba(184, 26, 46, 0.15);
        --banner-text-gradient: linear-gradient(135deg, #e0e0e0, #b09090);
        --banner-text-shadow: 0 0 25px rgba(139, 0, 0, 0.35);
        --banner-text-border: rgba(184, 26, 46, 0.5);
        --banner-overlay: linear-gradient(180deg, transparent 40%, rgba(20,20,22,0.85) 100%);
      }
      
      [data-theme="light"] {
        --bg: #fafafa; 
        --bg-alt: #f0f0f0;
        --fg: #2a2a2a; 
        --fg-muted: #666666;
        --accent: #c44555; 
        --accent-light: #e06070; 
        --accent-glow: rgba(196, 69, 85, 0.15);
        --border: #e0e0e0; 
        --border-hover: #c44555;
        --card-bg: #ffffff; 
        --card-bg-hover: #f8f8f8;
        --muted: rgba(196, 69, 85, 0.08);
        --card-radius: 14px; 
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        --shadow-hover: 0 12px 35px rgba(196, 69, 85, 0.15);
        --glow: 0 0 20px rgba(196, 69, 85, 0.08);
        --banner-text-gradient: linear-gradient(135deg, #e0e0e0, #b09090);
        --banner-text-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        --banner-text-border: rgba(255, 255, 255, 0.4);
        --banner-overlay: linear-gradient(180deg, transparent 30%, rgba(20,20,22,0.45) 95%, rgba(20,20,22,0.7) 100%);
      }
      
      .liminal-bg { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        pointer-events: none; z-index: -9999; overflow: hidden; 
        background: radial-gradient(ellipse at top, #252528 0%, var(--bg) 70%);
        transition: background 0.4s ease;
      }
      [data-theme="light"] .liminal-bg { background: radial-gradient(ellipse at top, #fff5f6 0%, #fafafa 70%); }
      
      .drift-glow { 
        position: absolute; width: 550px; height: 550px; bottom: -180px; left: -180px; 
        opacity: 0.1; filter: blur(70px); mix-blend-mode: screen; 
        animation: drift 60s infinite alternate ease-in-out; 
        background: radial-gradient(circle at 40% 30%, var(--accent-glow) 0%, transparent 50%);
        will-change: transform; contain: strict; transition: opacity 0.4s ease, background 0.4s ease;
      }
      [data-theme="light"] .drift-glow { opacity: 0.06; background: radial-gradient(circle at 40% 30%, rgba(196, 69, 85, 0.08) 0%, transparent 65%); }
      @keyframes drift { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(calc(100vw + 350px), calc(-100vh - 350px), 0); } }
      
      .loader { 
        position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; 
        background: var(--bg); z-index: 99999; color: var(--fg); 
        font-family: 'Unbounded', sans-serif; gap: 22px; padding: 20px;
        transition: opacity 0.5s ease, visibility 0.5s ease, background-color 0.4s ease;
      }
      .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-inner { display: flex; gap: 14px; align-items: center; }
      .loader .label { font-weight: 700; text-transform: uppercase; color: var(--accent-light); font-size: 1.15rem; letter-spacing: 5px; }
      .loader .dots { display: inline-block; width: 45px; text-align: left; }
      .loader .dots span { 
        display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; 
        background: var(--accent); opacity: 0.35; transform: translateY(0); 
        animation: dotPulse 1.2s infinite linear; box-shadow: 0 0 6px var(--accent-glow);
      }
      .loader .dots span:nth-child(1){ animation-delay: 0s } 
      .loader .dots span:nth-child(2){ animation-delay: 0.12s } 
      .loader .dots span:nth-child(3){ animation-delay: 0.24s }
      @keyframes dotPulse { 0%, 100% { opacity: 0.35; transform: scale(0.95); } 45% { opacity: 1; transform: scale(1.1) translateY(-4px); } }
      
      .loader-quote {
        font-size: 0.92rem; color: var(--fg-muted); text-align: center; max-width: 85%;
        line-height: 1.5; opacity: 0.8; letter-spacing: 0.5px;
        transition: opacity 0.25s ease; font-weight: 400;
        animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transform: translateY(10px);
      }
      .loader-quote.fade { opacity: 0.2; }
      @keyframes slideUp { to { transform: translateY(0); } }
      
      * { box-sizing: border-box; }
      html, body { 
        height: 100%; margin: 0; background: var(--bg); color: var(--fg); 
        font-family: 'Unbounded', sans-serif; position: relative; z-index: 1; 
        line-height: 1.6; scroll-behavior: smooth; transition: background-color 0.4s ease, color 0.4s ease;
      }
      .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px 100px; position: relative; z-index: 2; }
      
      .theme-toggle {
        position: fixed; top: 20px; right: 20px; z-index: 10000;
        width: 48px; height: 48px; border-radius: 50%; background: var(--card-bg);
        border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.25s ease, background-color 0.4s ease, border-color 0.4s ease;
        box-shadow: var(--shadow); font-size: 1.3rem; color: var(--fg);
      }
      .theme-toggle:hover { background: var(--card-bg-hover); border-color: var(--border-hover); transform: translateY(-2px) scale(1.05); box-shadow: var(--shadow-hover), var(--glow); }
      .theme-toggle:active { transform: scale(0.95); }
      .theme-toggle:focus { outline: 2px solid var(--accent); outline-offset: 3px; }
      .theme-toggle .icon { transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: block; }
      [data-theme="light"] .theme-toggle .icon { transform: rotate(180deg) scale(1.1); }
      
      .theme-ripple {
        position: fixed; top: 0; left: 0; width: 0; height: 0;
        pointer-events: none; z-index: 99998; border-radius: 50%;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        transform: scale(0); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
        opacity: 0; will-change: transform;
      }
      [data-theme="light"] .theme-ripple { background: radial-gradient(circle, rgba(196, 69, 85, 0.25) 0%, transparent 70%); }
      .theme-ripple.animate { opacity: 1; transform: scale(4); }
      
      .banner { 
        width: 100%; height: 320px; display: flex; justify-content: center; align-items: center; 
        margin-bottom: 45px; border-radius: var(--card-radius); overflow: hidden; position: relative; 
        box-shadow: var(--shadow), var(--glow); border: 1px solid var(--border); transition: box-shadow 0.4s ease, border-color 0.4s ease;
      }
      .banner::before {
        content: ""; position: absolute; inset: 0;
        background-image: url('https://dracoballoon.github.io/assets/banner.webp');
        background-size: cover; background-position: center; opacity: 1; z-index: 1; filter: none;
      }
      .banner::after {
        content: ""; position: absolute; inset: 0; background: var(--banner-overlay);
        z-index: 1; pointer-events: none; transition: background 0.4s ease;
      }
      .banner h1 { 
        font-size: 4em; background: var(--banner-text-gradient); -webkit-background-clip: text;
        -webkit-text-fill-color: transparent; background-clip: text; padding: 12px 26px; 
        border: 1px solid var(--banner-text-border); border-radius: 10px; backdrop-filter: blur(3px); 
        text-shadow: var(--banner-text-shadow); z-index: 2; margin: 0; position: relative;
        letter-spacing: 5px; font-weight: 700; transition: all 0.4s ease;
      }
      
      .gallery-section { margin: 65px 0; scroll-margin-top: 40px; }
      .gallery-section h2 { 
        font-size: 1.55rem; color: var(--accent-light); margin: 0 0 22px; padding-bottom: 10px; 
        border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; 
        text-transform: uppercase; letter-spacing: 2px; font-weight: 600; transition: color 0.4s ease, border-color 0.4s ease;
      }
      [data-theme="light"] .gallery-section h2 { color: var(--accent); }
      .gallery-section h2::before { 
        content: ""; width: 9px; height: 9px; background: var(--accent); border-radius: 50%; display: inline-block; 
        box-shadow: 0 0 10px var(--accent-glow); transition: background 0.4s ease, box-shadow 0.4s ease;
      }
      
      .image-placeholder { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 20px; }
      .image-box {
        position: relative; height: 285px; border-radius: var(--card-radius); overflow: hidden;
        background: var(--card-bg); box-shadow: var(--shadow); border: 1px solid var(--border);
        transition: transform 0.3s cubic-bezier(.2,.9,.2,1), box-shadow 0.3s, border-color 0.3s, background-color 0.4s ease;
        cursor: pointer; contain: layout style; will-change: transform;
      }
      .image-box img.thumb { 
        width: 100%; height: 100%; object-fit: cover; display: block; 
        transition: transform 0.4s ease, filter 0.3s; filter: brightness(0.9) contrast(1.1);
      }
      .image-box::before {
        content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse at 30% 20%, var(--accent-glow) 0%, transparent 50%);
        mix-blend-mode: overlay; opacity: 0.4; transition: opacity 0.4s ease;
      }
      [data-theme="light"] .image-box::before { opacity: 0.2; }
      .image-box:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover), var(--glow); border-color: var(--border-hover); }
      .image-box:hover img.thumb { transform: scale(1.04); filter: brightness(1) contrast(1.1); }
      [data-theme="light"] .image-box:hover img.thumb { filter: brightness(0.95) contrast(1.05); }
      
      .show-more-container { text-align: center; margin-top: 28px; grid-column: 1 / -1; }
      .toggle-btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px;
        background: var(--accent); color: #fff; border: 1px solid var(--accent-light);
        border-radius: 9px; font-family: 'Unbounded', sans-serif; font-size: 0.88rem;
        font-weight: 600; cursor: pointer; transition: all .25s; box-shadow: var(--shadow);
        text-transform: uppercase; letter-spacing: 1.2px;
      }
      .toggle-btn:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: var(--shadow-hover), var(--glow); }
      .toggle-btn .arrow { transition: transform 0.3s; }
      .toggle-btn:hover .arrow { transform: translateY(2px); }
      
      footer { 
        text-align: center; padding: 35px 20px 55px; color: var(--fg-muted); opacity: 0.75; font-size: 0.88rem; 
        border-top: 1px solid var(--border); margin-top: 50px; font-weight: 300; letter-spacing: 0.5px;
        transition: color 0.4s ease, border-color 0.4s ease, opacity 0.4s ease;
      }
      [data-theme="light"] footer { opacity: 0.85; }
      footer span { color: var(--accent-light); font-weight: 500; transition: color 0.4s ease; }
      [data-theme="light"] footer span { color: var(--accent); }
      .gallery-loading { 
        text-align: center; padding: 40px; color: var(--accent-light); background: var(--card-bg);
        border-radius: var(--card-radius); border: 1px dashed var(--border); grid-column: 1 / -1; 
        font-weight: 400; font-size: 0.9rem; transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
      }
      
      .lightbox {
        display: none; position: fixed; inset: 0; background: rgba(28, 28, 30, 0.98);
        z-index: 100000; justify-content: center; align-items: center;
        opacity: 0; transition: opacity 0.3s ease, background-color 0.4s ease;
      }
      [data-theme="light"] .lightbox { background: rgba(250, 250, 250, 0.97); }
      .lightbox.active { display: flex; opacity: 1; }
      .lightbox-content { position: relative; max-width: 95vw; max-height: 95vh; display: flex; justify-content: center; align-items: center; }
      .lightbox img { max-width: 100%; max-height: 95vh; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); border: 1px solid var(--border); transition: border-color 0.4s ease; }
      .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: var(--fg); background: none; border: none; cursor: pointer; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.3s ease; z-index: 100001; font-family: 'Unbounded', sans-serif; line-height: 1; }
      [data-theme="light"] .lightbox-close { background: rgba(255, 255, 255, 0.85); border: 1px solid var(--border); }
      .lightbox-close:hover { color: var(--accent-light); background: var(--muted); transform: rotate(90deg); }
      [data-theme="light"] .lightbox-close:hover { color: var(--accent); background: rgba(196, 69, 85, 0.1); border-color: var(--accent); }
      .lightbox-overlay { position: absolute; inset: 0; cursor: pointer; }
      
      @media (max-width: 900px) {
        h1 { font-size: 2.5rem; } .banner { height: 230px; } .banner h1 { font-size: 2.1rem; }
        .image-placeholder { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); } .image-box { height: 235px; }
        .lightbox-close { top: 15px; right: 20px; font-size: 2rem; width: 45px; height: 45px; }
        .theme-toggle { top: 15px; right: 15px; width: 44px; height: 44px; }
      }
      @media (max-width: 600px) {
        .container { padding: 40px 16px 80px; } .banner { height: 195px; border-radius: 12px; }
        .banner h1 { font-size: 1.85rem; padding: 10px 16px; letter-spacing: 3px; } 
        .gallery-section h2 { font-size: 1.3rem; }
        .image-placeholder { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } .image-box { height: 200px; }
        .lightbox-close { top: 10px; right: 15px; font-size: 1.75rem; width: 40px; height: 40px; }
        .theme-toggle { top: 12px; right: 12px; width: 42px; height: 42px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        .drift-glow, .theme-ripple, .theme-toggle, .lightbox { transition: none !important; animation: none !important; }
      }
      @media (max-width: 768px) { .drift-glow { display: none; } }
      .image-box { aspect-ratio: 215/285; }
    </style>
  </head>
  <body>
    <div class="liminal-bg"><div class="drift-glow"></div></div>
    <div class="theme-ripple" id="themeRipple"></div>
    
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">
      <span class="icon" aria-hidden="true">🌓</span>
    </button>
    
    <div class="loader" id="siteLoader" role="status" aria-live="polite">
      <div class="loader-inner">
        <div class="label">Draco</div>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <div class="loader-quote" id="loaderQuote">Loading...</div>
    </div>
    
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
      <div class="lightbox-overlay" id="lightboxOverlay"></div>
      <button class="lightbox-close" id="lightboxClose" aria-label="Close preview">&times;</button>
      <div class="lightbox-content"><img id="lightboxImage" src="" alt=""></div>
    </div>
    
    <div class="container" id="siteContent">
      <div class="banner" id="page-top"><h1>DRACO</h1></div>
      
      <div class="gallery-section"><h2>Original</h2><div id="gallery-original" class="image-placeholder" aria-busy="true"><div class="gallery-loading">Loading...</div></div><div class="show-more-container" id="showmore-original"></div></div>
      <div class="gallery-section"><h2>Comms</h2><div id="gallery-comms" class="image-placeholder" aria-busy="true"><div class="gallery-loading">Loading...</div></div><div class="show-more-container" id="showmore-comms"></div></div>
      <div class="gallery-section"><h2>Comic</h2><div id="gallery-comic" class="image-placeholder" aria-busy="true"><div class="gallery-loading">Loading...</div></div><div class="show-more-container" id="showmore-comic"></div></div>
      <div class="gallery-section"><h2>Stickers</h2><div id="gallery-stickers" class="image-placeholder" aria-busy="true"><div class="gallery-loading">Loading...</div></div><div class="show-more-container" id="showmore-stickers"></div></div>
      <div class="gallery-section"><h2>Memes</h2><div id="gallery-memes" class="image-placeholder" aria-busy="true"><div class="gallery-loading">Loading...</div></div><div class="show-more-container" id="showmore-memes"></div></div>
      
      <footer>© <span id="year"></span> Draco. All rights reserved.</footer>
    </div>
    
    <script>
      // === THEME MANAGEMENT ===
      const ThemeManager = {
        STORAGE_KEY: 'draco-theme-preference',
        DEFAULT: 'dark',
        init() {
          const saved = localStorage.getItem(this.STORAGE_KEY);
          document.documentElement.setAttribute('data-theme', saved || this.DEFAULT);
          document.getElementById('themeToggle')?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(this.STORAGE_KEY, next);
            this.ripple();
          });
        },
        ripple() {
          const el = document.getElementById('themeRipple');
          const btn = document.getElementById('themeToggle')?.getBoundingClientRect();
          if (!el || !btn) return;
          el.style.left = `${btn.left + btn.width/2}px`;
          el.style.top = `${btn.top + btn.height/2}px`;
          el.classList.add('animate');
          setTimeout(() => el.classList.remove('animate'), 500);
        }
      };

      // === CONFIG & STATE ===
      const CONFIG = { INITIAL_LOAD: 8, LOADER_DURATION: 4000, QUOTE_INTERVAL: 2500 };
      const state = { quotesInterval: null, loaderHidden: false, galleries: {} };
      const LOADER_QUOTES = [
        "Settling the den...", "Checking the trails...", "Shaking out the fur...", 
        "Patrolling the gallery...", "Warming the pack...", "Stretching the tail...", 
        "Marking the borders...", "Clearing the brush...", "Sharpening the claws...", 
        "Reading the wind...", "Gathering the flock...", "Testing the ground...", 
        "Scouting the path...", "Uncoiling the spine...", "Almost ready..."
      ];

      // === LOADER & QUOTES ===
      function startQuotes() {
        const el = document.getElementById('loaderQuote');
        if (!el) return;
        let idx = Math.floor(Math.random() * LOADER_QUOTES.length);
        el.textContent = LOADER_QUOTES[idx];
        
        state.quotesInterval = setInterval(() => {
          el.classList.add('fade');
          setTimeout(() => {
            idx = (idx + 1) % LOADER_QUOTES.length;
            el.textContent = LOADER_QUOTES[idx];
            el.classList.remove('fade');
          }, 250);
        }, CONFIG.QUOTE_INTERVAL);
      }

      function hideLoader() {
        if (state.loaderHidden) return;
        state.loaderHidden = true;
        clearInterval(state.quotesInterval);
        const loader = document.getElementById('siteLoader');
        if (loader) {
          loader.classList.add('hidden');
          document.body.style.overflow = '';
        }
      }

      // === LAZY LOADER ===
      class LazyLoader {
        constructor() {
          this.ob = 'IntersectionObserver' in window ? new IntersectionObserver(e => e.forEach(i => { if(i.isIntersecting){ this.load(i.target); this.ob.unobserve(i.target); } }), {rootMargin:'100px'}) : null;
        }
        load(img) {
          if (!img.dataset.src) return;
          const temp = new Image();
          temp.onload = () => img.src = img.dataset.src;
          temp.onerror = () => img.src = img.dataset.fallback;
          temp.src = img.dataset.src;
          img.removeAttribute('data-src');
        }
        observe(img) { if(img.dataset.src) this.ob ? this.ob.observe(img) : this.load(img); }
      }
      const lazy = new LazyLoader();

      // === GALLERY ===
      async function loadGallery(id, folder) {
        const container = document.getElementById(id);
        if (!container) return;
        state.galleries[folder] = { images: [], expanded: false };
        
        try {
          const res = await fetch(`https://api.github.com/repos/dracoballoon/dracoballoon.github.io/contents/projects/${folder}`, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
          if (!res.ok) throw new Error(res.status);
          const files = (await res.json()).filter(f => f.type === 'file' && /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f.name));
          state.galleries[folder].images = files.map(f => ({ url: f.download_url, title: f.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, ' ') }));
        } catch {
          state.galleries[folder].images = [{ url: `https://via.placeholder.com/400x500/1c1c1e/b81a2e?text=${folder}`, title: `Fallback ${folder}` }];
        }
        render(id, folder);
      }

      function render(id, folder, expand = false) {
        const container = document.getElementById(id);
        if (!container) return;
        const data = state.galleries[folder];
        const count = expand ? data.images.length : Math.min(CONFIG.INITIAL_LOAD, data.images.length);
        container.innerHTML = '';
        container.setAttribute('aria-busy', 'false');

        for (let i = 0; i < count; i++) {
          const imgData = data.images[i];
          const box = document.createElement('div');
          box.className = 'image-box';
          const img = document.createElement('img');
          img.className = 'thumb';
          img.alt = imgData.title;
          img.dataset.src = imgData.url;
          img.dataset.fallback = CONFIG.FALLBACK?.[folder] || '';
          box.addEventListener('click', () => {
            document.getElementById('lightboxImage').src = imgData.url;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
          });
          box.appendChild(img);
          container.appendChild(box);
          lazy.observe(img);
        }

        const showMore = document.getElementById(`showmore-${folder}`);
        if (showMore && data.images.length > CONFIG.INITIAL_LOAD) {
          const isExp = data.expanded;
          showMore.innerHTML = `<button class="toggle-btn" onclick="toggle('${folder}')">${isExp ? 'Less' : 'More'} <span class="arrow">${isExp ? '▲' : '▼'}</span></button>`;
        }
      }

      window.toggle = (folder) => {
        const data = state.galleries[folder];
        if (!data) return;
        data.expanded = !data.expanded;
        render(`gallery-${folder}`, folder, data.expanded);
      };

      // === LIGHTBOX ===
      const lb = document.getElementById('lightbox');
      document.getElementById('lightboxClose')?.addEventListener('click', () => lb.classList.remove('active'));
      document.getElementById('lightboxOverlay')?.addEventListener('click', () => lb.classList.remove('active'));
      document.addEventListener('keydown', e => { if(e.key==='Escape' && lb.classList.contains('active')) lb.classList.remove('active'); });
      lb.addEventListener('transitionend', () => { if(!lb.classList.contains('active')) document.getElementById('lightboxImage').src = ''; });
      lb.addEventListener('click', e => { if(e.target===lb) lb.classList.remove('active'); });

      // === INIT ===
      document.addEventListener('DOMContentLoaded', () => {
        ThemeManager.init();
        document.getElementById('year').textContent = new Date().getFullYear();
        startQuotes();
        setTimeout(hideLoader, CONFIG.LOADER_DURATION);
        
        ['original', 'comms', 'comic', 'stickers', 'memes'].forEach(f => loadGallery(`gallery-${f}`, f));
      });
    </script>
  </body>
</html>
