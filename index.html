<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Draco</title>
    <meta name="description" content="Draco - Art gallery featuring comic, original, comms, memes & stickers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a0a; 
        --bg-alt: #111111;
        --fg: #f0f0f0; 
        --fg-muted: #9a9a9a;
        --accent: #8b0000; 
        --accent-light: #b81a2e; 
        --accent-glow: rgba(139, 0, 0, 0.25);
        --border: #262626; 
        --border-hover: #7a0000;
        --card-bg: #141414; 
        --card-bg-hover: #1a1a1a;
        --muted: rgba(139, 0, 0, 0.10);
        --card-radius: 14px; 
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        --shadow-hover: 0 20px 50px rgba(139, 0, 0, 0.25);
        --glow: 0 0 25px rgba(139, 0, 0, 0.15);
      }
      
      .liminal-bg { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        pointer-events: none; z-index: -9999; overflow: hidden; 
        contain: layout style paint; 
        will-change: transform;
        background: radial-gradient(ellipse at top, #120404 0%, #0a0a0a 70%);
      }
      .drift-glow { 
        position: absolute; width: 550px; height: 550px; bottom: -180px; left: -180px; 
        opacity: 0.12; filter: blur(70px); mix-blend-mode: screen; 
        animation: drift-br-tr 60s infinite alternate ease-in-out; 
        background: radial-gradient(circle at 40% 30%, var(--accent-glow) 0%, transparent 50%), 
                    radial-gradient(circle at 70% 60%, rgba(139, 0, 0, 0.15) 0%, transparent 65%);
        will-change: transform;
        contain: strict;
      }
      @keyframes drift-br-tr { 
        0% { transform: translate3d(0, 0, 0); } 
        100% { transform: translate3d(calc(100vw + 350px), calc(-100vh - 350px), 0); } 
      }
      
      .loader { 
        position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; 
        background: var(--bg); z-index: 99999; font-size: 1.05rem; letter-spacing: 3px; 
        color: var(--fg); transition: opacity .45s ease, visibility .45s ease; 
        font-family: 'Unbounded', sans-serif; contain: layout style;
        flex-direction: column; gap: 22px; padding: 20px;
      }
      .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-inner { display: flex; gap: 14px; align-items: center; }
      .loader .label { 
        font-weight: 700; text-transform: uppercase; color: var(--accent-light); 
        font-size: 1.15rem; letter-spacing: 5px;
      }
      .loader .dots { display: inline-block; width: 45px; text-align: left; }
      .loader .dots span { 
        display: inline-block; width: 6px; height: 6px; margin-right: 8px; 
        border-radius: 50%; background: var(--accent); opacity: .25; 
        transform: translateY(0); animation: dot 1.2s infinite linear; 
        will-change: transform, opacity;
        box-shadow: 0 0 6px rgba(139, 0, 0, 0.4);
      }
      .loader .dots span:nth-child(1){ animation-delay: 0s } 
      .loader .dots span:nth-child(2){ animation-delay: 0.12s } 
      .loader .dots span:nth-child(3){ animation-delay: 0.24s }
      @keyframes dot { 
        0%, 100% { opacity: .25; transform: translateY(0) scale(.95); } 
        45% { opacity: 1; transform: translateY(-5px) scale(1); } 
      }
      
      .loader-quote {
        font-size: 0.92rem;
        color: var(--fg-muted);
        text-align: center;
        max-width: 80%;
        line-height: 1.5;
        opacity: 0.75;
        transform: translateY(8px);
        animation: quoteSlideIn .4s ease forwards;
        font-weight: 400;
        letter-spacing: 0.8px;
        transition: opacity 0.2s ease;
      }
      @keyframes quoteSlideIn { to { transform: translateY(0); } }
      
      * { box-sizing: border-box; }
      html, body { 
        height: 100%; margin: 0; background: var(--bg); color: var(--fg); 
        font-family: 'Unbounded', sans-serif; position: relative; z-index: 1; 
        line-height: 1.6; scroll-behavior: smooth; 
      }
      .container { 
        max-width: 1100px; margin: 0 auto; padding: 60px 20px 100px; 
        position: relative; z-index: 2; contain: layout style; 
      }
      
      .banner { 
        width: 100%; height: 320px; 
        background: linear-gradient(135deg, var(--accent), #350000);
        display: flex; justify-content: center; align-items: center; 
        margin-bottom: 45px; border-radius: var(--card-radius); 
        overflow: hidden; position: relative; 
        box-shadow: var(--shadow), var(--glow);
        border: 1px solid var(--border);
      }
      .banner::before {
        content: ""; position: absolute; inset: 0;
        background-image: url('https://dracoballoon.github.io/assets/banner.jpeg');
        background-size: cover; background-position: center;
        opacity: 0.10; transition: opacity 0.4s ease;
        z-index: 1; filter: contrast(1.15) saturate(1.1);
      }
      .banner.loaded::before { opacity: 0.18; }
      .banner::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, transparent 50%, rgba(10,10,10,0.96) 100%);
        z-index: 1;
      }
      .banner h1 { 
        font-size: 4em; 
        background: linear-gradient(135deg, #e0e0e0, #b09090);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        padding: 12px 26px; 
        border: 1px solid var(--accent); 
        border-radius: 10px; 
        backdrop-filter: blur(3px); 
        text-shadow: 0 0 25px rgba(139, 0, 0, 0.35); 
        z-index: 2; margin: 0; position: relative;
        letter-spacing: 5px;
        font-weight: 700;
      }
      
      .gallery-section { margin: 65px 0; scroll-margin-top: 40px; }
      .gallery-section h2 { 
        font-size: 1.55rem; color: var(--accent-light); margin: 0 0 22px; 
        padding-bottom: 10px; border-bottom: 1px solid var(--border); 
        display: flex; align-items: center; gap: 10px; 
        text-transform: uppercase; letter-spacing: 2px;
        font-weight: 600;
      }
      .gallery-section h2::before { 
        content: ""; width: 9px; height: 9px; background: var(--accent); 
        border-radius: 50%; display: inline-block; 
        box-shadow: 0 0 10px rgba(139, 0, 0, 0.5); 
      }
      
      .image-placeholder { 
        display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); 
        gap: 20px; contain: layout; 
      }
      .image-box {
        position: relative; height: 285px; border-radius: var(--card-radius);
        overflow: hidden; background: var(--card-bg); 
        box-shadow: var(--shadow);
        transition: transform .3s cubic-bezier(.2,.9,.2,1), box-shadow .3s, border-color .3s;
        border: 1px solid var(--border); contain: layout style;
        will-change: transform;
        cursor: pointer;
      }
      .image-box img.thumb { 
        width: 100%; height: 100%; object-fit: cover; display: block; 
        transition: transform .4s ease, filter .3s; 
        filter: brightness(0.9) contrast(1.1);
      }
      .image-box::before {
        content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse at 30% 20%, rgba(139, 0, 0, 0.06) 0%, transparent 50%),
                    linear-gradient(180deg, rgba(20,20,20,0.05) 10%, rgba(139,0,0,0.12) 85%);
        mix-blend-mode: overlay;
        opacity: 0.5;
      }
      .image-box .meta {
        position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px;
        z-index: 2; display: flex; justify-content: space-between; align-items: center;
        background: linear-gradient(180deg, rgba(20,20,20,0), rgba(10,10,10,0.97));
        color: var(--fg); border-top: 1px solid var(--border);
      }
      .image-box .meta .title { font-weight: 600; font-size: 0.95rem; color: var(--accent-light); }
      .image-box .meta .sub { font-size: 0.75rem; opacity: 0.65; color: var(--fg-muted); }
      .image-box:hover { 
        transform: translateY(-4px); 
        box-shadow: var(--shadow-hover), var(--glow); 
        border-color: var(--border-hover);
      }
      .image-box:hover img.thumb { 
        transform: scale(1.04); 
        filter: brightness(0.95) contrast(1.15);
      }
      
      .show-more-container { text-align: center; margin-top: 28px; grid-column: 1 / -1; }
      .toggle-btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px;
        background: var(--accent); 
        color: #fff; border: 1px solid var(--accent-light);
        border-radius: 9px; font-family: 'Unbounded', sans-serif; font-size: 0.88rem;
        font-weight: 600; cursor: pointer; transition: all .25s; 
        box-shadow: var(--shadow);
        text-transform: uppercase; letter-spacing: 1.2px;
      }
      .toggle-btn:hover { 
        background: var(--accent-light); 
        transform: translateY(-2px); 
        box-shadow: var(--shadow-hover), var(--glow); 
      }
      .toggle-btn .arrow { font-size: 0.95rem; transition: transform .3s; }
      .toggle-btn:hover .arrow { transform: translateY(2px); }
      
      footer { 
        text-align: center; padding: 35px 20px 55px; 
        color: var(--fg-muted); opacity: 0.75; font-size: 0.88rem; 
        border-top: 1px solid var(--border); margin-top: 50px; 
        font-weight: 300; letter-spacing: 0.5px;
      }
      footer span { color: var(--accent-light); font-weight: 500; }
      .gallery-loading { 
        text-align: center; padding: 40px; color: var(--accent-light); 
        background: var(--card-bg); border-radius: var(--card-radius); 
        border: 1px dashed var(--border); grid-column: 1 / -1; 
        font-weight: 400; font-size: 0.9rem;
      }
      
      /* Lightbox Styles */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 10, 0.98);
        z-index: 100000;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .lightbox.active {
        display: flex;
        opacity: 1;
      }
      .lightbox-content {
        position: relative;
        max-width: 95vw;
        max-height: 95vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .lightbox img {
        max-width: 100%;
        max-height: 95vh;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), var(--glow);
        border: 1px solid var(--border);
      }
      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 2.5rem;
        color: var(--fg);
        background: none;
        border: none;
        cursor: pointer;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.3s ease;
        z-index: 100001;
        font-family: 'Unbounded', sans-serif;
        line-height: 1;
      }
      .lightbox-close:hover {
        color: var(--accent-light);
        background: rgba(139, 0, 0, 0.15);
        transform: rotate(90deg);
      }
      .lightbox-overlay {
        position: absolute;
        inset: 0;
        cursor: pointer;
      }
      
      @media (max-width: 900px) {
        h1 { font-size: 2.5rem; } .banner { height: 230px; } .banner h1 { font-size: 2.1rem; }
        .image-placeholder { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); }
        .image-box { height: 235px; }
        .lightbox-close { top: 15px; right: 20px; font-size: 2rem; width: 45px; height: 45px; }
      }
      @media (max-width: 600px) {
        .container { padding: 40px 16px 80px; } .banner { height: 195px; border-radius: 12px; }
        .banner h1 { font-size: 1.85rem; padding: 10px 16px; letter-spacing: 3px; } 
        .gallery-section h2 { font-size: 1.3rem; }
        .image-placeholder { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        .image-box { height: 200px; }
        .lightbox-close { top: 10px; right: 15px; font-size: 1.75rem; width: 40px; height: 40px; }
      }
      
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        .drift-glow { display: none; }
        .lightbox { transition: none; }
      }
      @media (max-width: 768px) {
        .drift-glow { display: none; }
      }
      
      .image-box { aspect-ratio: 215/285; }
      body::before, body::after, .container::before, .container::after { display: none !important; }
    </style>
  </head>
  <body>
    <div class="liminal-bg">
      <div class="drift-glow"></div>
    </div>
    
    <div class="loader" id="siteLoader" role="status" aria-live="polite">
      <div class="loader-inner">
        <div class="label">Draco</div>
        <div class="dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="loader-quote" id="loaderQuote">Loading...</div>
    </div>
    
    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
      <div class="lightbox-overlay" id="lightboxOverlay"></div>
      <button class="lightbox-close" id="lightboxClose" aria-label="Close preview">&times;</button>
      <div class="lightbox-content">
        <img id="lightboxImage" src="" alt="">
      </div>
    </div>
    
    <div class="container" id="siteContent">
      <div class="banner" id="page-top">
        <h1>DRACO</h1>
      </div>
      
      <!-- Original Section -->
      <div class="gallery-section">
        <h2>Original</h2>
        <div id="gallery-original" class="image-placeholder" aria-busy="true">
          <div class="gallery-loading">Loading original pieces...</div>
        </div>
        <div class="show-more-container" id="showmore-original"></div>
      </div>
      
      <!-- Comms Section -->
      <div class="gallery-section">
        <h2>Comms</h2>
        <div id="gallery-comms" class="image-placeholder" aria-busy="true">
          <div class="gallery-loading">Loading commissions...</div>
        </div>
        <div class="show-more-container" id="showmore-comms"></div>
      </div>
      
      <!-- Comic Section -->
      <div class="gallery-section">
        <h2>Comic</h2>
        <div id="gallery-comic" class="image-placeholder" aria-busy="true">
          <div class="gallery-loading">Loading comic artworks...</div>
        </div>
        <div class="show-more-container" id="showmore-comic"></div>
      </div>
      
      <!-- Stickers Section -->
      <div class="gallery-section">
        <h2>Stickers</h2>
        <div id="gallery-stickers" class="image-placeholder" aria-busy="true">
          <div class="gallery-loading">Loading stickers...</div>
        </div>
        <div class="show-more-container" id="showmore-stickers"></div>
      </div>
      
      <!-- Memes Section -->
      <div class="gallery-section">
        <h2>Memes</h2>
        <div id="gallery-memes" class="image-placeholder" aria-busy="true">
          <div class="gallery-loading">Loading memes...</div>
        </div>
        <div class="show-more-container" id="showmore-memes"></div>
      </div>
      
      <footer>
        © <span id="year"></span> Draco. All rights reserved.
      </footer>
    </div>
    
    <script>
      // === CONFIG ===
      const CONFIG = {
        INITIAL_LOAD: 8,
        CACHE_TTL: 24 * 60 * 60 * 1000,
        API_BASE: 'https://api.github.com/repos/dracoballoon/dracoballoon.github.io/contents/projects',
        FALLBACK_IMAGES: {
          original: ['https://via.placeholder.com/400x500/141414/b81a2e?text=Original'],
          comms: ['https://via.placeholder.com/400x500/141414/b81a2e?text=Comms'],
          comic: ['https://via.placeholder.com/400x500/141414/b81a2e?text=Comic'],
          stickers: ['https://via.placeholder.com/400x500/141414/b81a2e?text=Stickers'],
          memes: ['https://via.placeholder.com/400x500/141414/b81a2e?text=Memes']
        },
        LOADER_DURATION: 5000,
        QUOTE_INTERVAL: 2800
      };

      // Discrete furry-coded loading quotes
      const LOADER_QUOTES = [
        "Settling the den...",
        "Checking the trails...",
        "Shaking out the fur...",
        "Patrolling the gallery...",
        "Warming the pack...",
        "Stretching the tail...",
        "Marking the borders...",
        "Clearing the brush...",
        "Sharpening the claws...",
        "Reading the wind...",
        "Gathering the flock...",
        "Testing the ground...",
        "Scouting the path...",
        "Uncoiling the spine...",
        "Almost ready..."
      ];

      // === STATE ===
      const state = {
        galleries: {
          original: { images: [], expanded: false, loaded: false },
          comms: { images: [], expanded: false, loaded: false },
          comic: { images: [], expanded: false, loaded: false },
          stickers: { images: [], expanded: false, loaded: false },
          memes: { images: [], expanded: false, loaded: false }
        },
        loaderHidden: false,
        quoteInterval: null,
        currentQuoteIndex: 0
      };

      // === CACHE ===
      const cache = {
        get(key) {
          try {
            const item = localStorage.getItem(`draco:${key}`);
            if (!item) return null;
            const { data, timestamp } = JSON.parse(item);
            if (Date.now() - timestamp > CONFIG.CACHE_TTL) {
              localStorage.removeItem(`draco:${key}`);
              return null;
            }
            return data;
          } catch { return null; }
        },
        set(key, data) {
          try {
            localStorage.setItem(`draco:${key}`, JSON.stringify({ data, timestamp: Date.now() }));
          } catch (e) { console.warn('Cache write failed:', e); }
        }
      };

      // === QUOTE ROTATOR ===
      function startQuoteRotation() {
        const quoteEl = document.getElementById('loaderQuote');
        if (!quoteEl) return;

        state.currentQuoteIndex = Math.floor(Math.random() * LOADER_QUOTES.length);
        quoteEl.textContent = LOADER_QUOTES[state.currentQuoteIndex];

        state.quoteInterval = setInterval(() => {
          state.currentQuoteIndex = (state.currentQuoteIndex + 1) % LOADER_QUOTES.length;
          
          quoteEl.style.transition = 'opacity 0.2s ease';
          quoteEl.style.opacity = '0.4';
          
          setTimeout(() => {
            quoteEl.textContent = LOADER_QUOTES[state.currentQuoteIndex];
            quoteEl.style.opacity = '0.75';
          }, 200);
        }, CONFIG.QUOTE_INTERVAL);
      }

      function stopQuoteRotation() {
        if (state.quoteInterval) {
          clearInterval(state.quoteInterval);
          state.quoteInterval = null;
        }
      }

      function hideLoader() {
        if (state.loaderHidden) return;
        stopQuoteRotation();
        
        const loader = document.getElementById('siteLoader');
        if (loader) {
          loader.classList.add('hidden');
          document.body.style.overflow = '';
          state.loaderHidden = true;
        }
      }

      // === LIGHTBOX ===
      const lightbox = {
        el: document.getElementById('lightbox'),
        img: document.getElementById('lightboxImage'),
        closeBtn: document.getElementById('lightboxClose'),
        overlay: document.getElementById('lightboxOverlay'),
        
        open(src) {
          if (!this.el || !this.img) return;
          this.img.src = src;
          this.el.classList.add('active');
          document.body.style.overflow = 'hidden';
        },
        
        close() {
          if (!this.el) return;
          this.el.classList.remove('active');
          document.body.style.overflow = '';
          setTimeout(() => {
            if (this.img) this.img.src = '';
          }, 300);
        },
        
        init() {
          if (!this.closeBtn || !this.overlay) return;
          
          this.closeBtn.addEventListener('click', () => this.close());
          this.overlay.addEventListener('click', () => this.close());
          
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.el.classList.contains('active')) {
              this.close();
            }
          });
        }
      };

      // === LAZY IMAGE LOADER ===
      class LazyImageLoader {
        constructor() { this.observer = null; this.init(); }
        init() {
          if ('IntersectionObserver' in window) {
            this.observer = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  this.loadImage(entry.target);
                  this.observer.unobserve(entry.target);
                }
              });
            }, { rootMargin: '100px' });
          }
        }
        loadImage(img) {
          const src = img.dataset.src;
          if (!src) return;
          const temp = new Image();
          temp.onload = () => { img.src = src; img.classList.add('loaded'); };
          temp.onerror = () => { img.src = img.dataset.fallback; };
          temp.src = src;
          img.removeAttribute('data-src');
        }
        observe(img) {
          if (this.observer && img.dataset.src) this.observer.observe(img);
          else if (img.dataset.src) this.loadImage(img);
        }
      }
      const lazyLoader = new LazyImageLoader();

      // === GALLERY LOADING ===
      async function loadGallery(containerId, folderName, sectionTitle) {
        const container = document.getElementById(containerId);
        const cacheKey = `gallery:${folderName}`;
        
        try {
          let files = cache.get(cacheKey);
          if (!files) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(`${CONFIG.API_BASE}/${folderName}`, {
              signal: controller.signal,
              headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            clearTimeout(timeout);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            files = await response.json();
            cache.set(cacheKey, files);
          }
          
          const images = files
            .filter(f => f.type === 'file' && /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f.name))
            .sort((a, b) => {
              const na = parseInt(a.name), nb = parseInt(b.name);
              return (!isNaN(na) && !isNaN(nb)) ? na - nb : a.name.localeCompare(b.name, 'en', { numeric: true });
            })
            .slice(0, 50);
          
          state.galleries[folderName].images = images.map((f, i) => ({
            title: f.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, ' '),
            url: f.download_url,
            width: 400, height: 500
          }));
          
          state.galleries[folderName].loaded = true;
          renderGallery(containerId, folderName, false);
          
        } catch (err) {
          console.warn(`Gallery ${folderName} failed:`, err.message);
          state.galleries[folderName].images = CONFIG.FALLBACK_IMAGES[folderName].map((url, i) => ({
            title: `Artwork ${i + 1}`, url, width: 400, height: 500
          }));
          state.galleries[folderName].loaded = true;
          renderGallery(containerId, folderName, false);
        }
      }

      function renderGallery(containerId, folderName, expanded) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        const data = state.galleries[folderName];
        const count = expanded ? data.images.length : Math.min(CONFIG.INITIAL_LOAD, data.images.length);
        const fragment = document.createDocumentFragment();
        container.innerHTML = '';
        
        for (let i = 0; i < count; i++) {
          const img = data.images[i];
          const box = document.createElement('div');
          box.className = 'image-box';
          box.setAttribute('role', 'article');
          box.setAttribute('aria-label', `Artwork ${i + 1}`);
          
          const imageEl = document.createElement('img');
          imageEl.className = 'thumb';
          imageEl.alt = `Artwork ${i + 1}`;
          imageEl.loading = 'lazy';
          imageEl.decoding = 'async';
          imageEl.dataset.src = img.url;
          imageEl.dataset.fallback = CONFIG.FALLBACK_IMAGES[folderName]?.[0];
          imageEl.style.aspectRatio = `${img.width}/${img.height}`;
          
          // Add click event to open lightbox
          box.addEventListener('click', () => {
            lightbox.open(img.url);
          });
          
          // Remove meta section (filename display)
          // const meta = document.createElement('div');
          // meta.className = 'meta';
          // meta.innerHTML = `<span class="title">${img.title}</span><span class="sub">#${i + 1}</span>`;
          
          box.appendChild(imageEl);
          // box.appendChild(meta);
          fragment.appendChild(box);
          lazyLoader.observe(imageEl);
        }
        
        container.appendChild(fragment);
        container.setAttribute('aria-busy', 'false');
        updateToggleButton(folderName);
      }

      function updateToggleButton(folderName) {
        const container = document.getElementById(`showmore-${folderName}`);
        if (!container) return;
        const total = state.galleries[folderName].images.length;
        if (total <= CONFIG.INITIAL_LOAD) { container.innerHTML = ''; return; }
        const isExpanded = state.galleries[folderName].expanded;
        const arrow = isExpanded ? '▲' : '▼';
        const text = isExpanded ? 'Less' : `More (${total - CONFIG.INITIAL_LOAD}+)`;
        container.innerHTML = `<button class="toggle-btn" onclick="window.toggleGallery('${folderName}')" aria-expanded="${isExpanded}">${text} <span class="arrow" aria-hidden="true">${arrow}</span></button>`;
      }

      window.toggleGallery = function(folderName) {
        const data = state.galleries[folderName];
        if (!data) return;
        data.expanded = !data.expanded;
        renderGallery(`gallery-${folderName}`, folderName, data.expanded);
        const section = document.querySelector(`#gallery-${folderName}`)?.closest('.gallery-section');
        if (section && data.expanded) section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };

      // === INIT ===
      document.addEventListener('DOMContentLoaded', () => {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        document.getElementById('year').textContent = new Date().getFullYear();

        startQuoteRotation();
        setTimeout(() => hideLoader(), CONFIG.LOADER_DURATION);

        // Initialize lightbox
        lightbox.init();

        // Banner load
        const banner = document.querySelector('.banner');
        if (banner) {
          const bg = new Image();
          bg.onload = bg.onerror = () => banner.classList.add('loaded');
          bg.src = 'https://dayowen.github.io/assets/banner.jpeg';
        }

        // Load galleries in new order
        Promise.allSettled([
          loadGallery('gallery-original', 'original', 'Original'),
          loadGallery('gallery-comms', 'comms', 'Comms'),
          loadGallery('gallery-comic', 'comic', 'Comic'),
          loadGallery('gallery-stickers', 'stickers', 'Stickers'),
          loadGallery('gallery-memes', 'memes', 'Memes')
        ]);
      });

      // === PERF MONITOR ===
      if ('PerformanceObserver' in window) {
        try {
          const obs = new PerformanceObserver((list) => {
            list.getEntries().forEach(e => e.entryType === 'longtask' && console.debug('Long task:', e.duration, 'ms'));
          });
          obs.observe({ entryTypes: ['longtask'] });
        } catch (e) {}
      }
    </script>
  </body>
</html>
